services:
  postgres:
    image: postgres:17-alpine
    container_name: trinh-ca-phe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trinhca
      POSTGRES_USER: trinhca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinhca -d trinhca"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
